name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # reef-perf's Python; inference-engine's is linted by its own workflow.
    defaults:
      run:
        working-directory: reef-perf
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check formatting
        run: uvx ruff@0.16.5 format --check

      - name: Check lint
        run: uvx ruff@0.16.5 check
