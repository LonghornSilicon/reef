name: PD checks

on:
  push:
    branches: ["**"]
    paths: ["pd/**", ".github/workflows/pd-checks.yml"]
  pull_request:
    paths: ["pd/**", ".github/workflows/pd-checks.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pd
    env:
      RUN: docker run --rm -v ${{ github.workspace }}:/app/reef -w /app/reef/pd reef-pd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pd/docker
          tags: reef-pd
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: $RUN bash tools/check.sh
      - run: $RUN make import TARGET=toy_counter HANDOFF=tests/fixtures/handoff_example RUN_ID=ci
      - run: $RUN uv run python tools/summarize_run.py runs/toy_counter/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pd-run-summary
          path: pd/runs/toy_counter/ci/summary.md
