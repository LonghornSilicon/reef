name: RTL checks

on:
  push:
    branches: ["**"]  # listing tags alone would stop branch pushes from triggering
    tags: ["rtl-*"]
    paths: ["rtl/**", ".github/workflows/rtl-checks.yml"]
  pull_request:
    paths: ["rtl/**", ".github/workflows/rtl-checks.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # only used to attach the handoff package to a tag's release
    defaults:
      run:
        working-directory: rtl
    env:
      # Everything runs inside the rtl image with the repo mounted at /app/reef.
      RUN: docker run --rm -v ${{ github.workspace }}:/app/reef -w /app/reef/rtl reef-rtl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rtl/docker
          tags: reef-rtl
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: $RUN bash tools/check.sh
      - run: $RUN make export TARGET=toy_counter
      - run: $RUN uv run python tools/validate_handoff.py out/toy_counter/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-toy_counter
          path: rtl/out/toy_counter
      - run: tar -C out -czf handoff-toy_counter.tgz toy_counter
        if: github.ref_type == 'tag'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.ref_type == 'tag'
        with:
          files: rtl/handoff-toy_counter.tgz

  # src/reef/gen is a build output: regenerate it from the Chisel in src/reef and fail on
  # any diff, so nobody edits the generated SV by hand.
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CACHE: ${{ github.workspace }}/../bazel-cache
      MEM: 12g
      BAZEL_FLAGS: --jobs=4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bazel's cache only. The key moves with the Bazel inputs and the regen script (which
      # sets the workspace status; Bazel never rebuilds for a status change alone).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../bazel-cache
          key: coralnpu-bazel-v1-${{ hashFiles('rtl/tools/regen_coralnpu.sh') }}-${{ hashFiles('rtl/src/reef/WORKSPACE', 'rtl/src/reef/.bazelversion', 'rtl/src/reef/rules/**', 'rtl/src/reef/third_party/**') }}
          restore-keys: coralnpu-bazel-v1-${{ hashFiles('rtl/tools/regen_coralnpu.sh') }}-
      # The Coral image builds as uid 1000, the runner is 1001, and Bazel leaves its files
      # read-only: hand the cache to the image, then back so actions/cache can save it.
      - run: mkdir -p "$CACHE" && sudo chown -R 1000:1000 "$CACHE"
      - run: rtl/tools/regen_coralnpu.sh --check
      - run: sudo chown -R "$(id -u):$(id -g)" "$CACHE"
        if: always()
