<text x="725.7" y="110.0" font-size="16" fill="#1f1f1e" font-weight="700" text-anchor="start">What is on the chip</text>
<rect x="725.685424949238" y="125" width="14" height="14" rx="3" fill="#2a78d6"/>
<text x="747.7" y="136.0" font-size="13" fill="#1f1f1e" font-weight="600" text-anchor="start">RVV vector unit (RVV 1.0, VLEN 128, FP32)</text>
<text x="747.7" y="152.0" font-size="12" fill="#55544f" font-weight="400" text-anchor="start">4.00 mm² cells</text>
<rect x="725.685424949238" y="165" width="14" height="14" rx="3" fill="#eb6834"/>
<text x="747.7" y="176.0" font-size="13" fill="#1f1f1e" font-weight="600" text-anchor="start">Scalar RISC-V core + scalar FPU</text>
<text x="747.7" y="192.0" font-size="12" fill="#55544f" font-weight="400" text-anchor="start">0.95 mm² cells</text>
<rect x="725.685424949238" y="205" width="14" height="14" rx="3" fill="#4a3aa7"/>
<text x="747.7" y="216.0" font-size="13" fill="#1f1f1e" font-weight="600" text-anchor="start">AXI slave, debug, Reef shell</text>
<text x="747.7" y="232.0" font-size="12" fill="#55544f" font-weight="400" text-anchor="start">0.09 mm² cells</text>
<rect x="725.685424949238" y="245" width="14" height="14" rx="3" fill="#1baf7a"/>
<text x="747.7" y="256.0" font-size="13" fill="#1f1f1e" font-weight="600" text-anchor="start">TCM SRAM macros (ITCM 8 KB + DTCM 32 KB)</text>
<text x="747.7" y="272.0" font-size="12" fill="#55544f" font-weight="400" text-anchor="start">~8 mm² (estimate)</text>
<rect x="725.685424949238" y="285" width="14" height="14" rx="3" fill="#3b3a36"/>
<text x="747.7" y="296.0" font-size="13" fill="#1f1f1e" font-weight="600" text-anchor="start">IO ring (10 signal pads, gold)</text>
<text x="747.7" y="312.0" font-size="12" fill="#55544f" font-weight="400" text-anchor="start">~2 mm²</text>
<rect x="725.685424949238" y="325" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#bdbcb6"/>
<text x="747.7" y="336.0" font-size="13" fill="#1f1f1e" font-weight="600" text-anchor="start">Spare core area / halo / routing</text>
<text x="747.7" y="352.0" font-size="12" fill="#55544f" font-weight="400" text-anchor="start">≈ 14.8 mm²</text>
<text x="725.7" y="388.0" font-size="16" fill="#1f1f1e" font-weight="700" text-anchor="start">Numbers</text>
<text x="725.7" y="412.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">Logic cells: ≈5.0 mm² (DC, 10 ns, met at tt only)</text>
<text x="725.7" y="432.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">Logic footprint at 70% util.: 7.2 mm²</text>
<text x="725.7" y="452.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">Die: 32 mm² (drawn square; the real frame may not be)</text>
<text x="725.7" y="472.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">Host access: SPI -&gt; AXI (ITCM, DTCM, CSR)</text>
<text x="725.7" y="506.0" font-size="16" fill="#1f1f1e" font-weight="700" text-anchor="start">Read this as a sketch</text>
<text x="725.7" y="530.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">• No placement or routing has been done yet;</text>
<text x="725.7" y="549.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">  block positions are arbitrary, sizes are to scale.</text>
<text x="725.7" y="568.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">• Timing: 10 ns holds only at tt. At the ss corner</text>
<text x="725.7" y="587.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">  ~20 ns (50 MHz) closes, before P&amp;R.</text>
<text x="725.7" y="606.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">• SRAM: ~8 mm² is PD's estimate; sky130 OpenRAM</text>
<text x="725.7" y="625.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">  macros would be 20 x 0.285 = 5.7 mm² + halo.</text>
<text x="725.7" y="644.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">• PD's own estimate of the logic is ~21 mm²;</text>
<text x="725.7" y="663.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">  until that is reconciled, the spare area may not exist.</text>
<text x="725.7" y="682.0" font-size="12.5" fill="#55544f" font-weight="400" text-anchor="start">• Hover a block for its exact area.</text>
</svg>