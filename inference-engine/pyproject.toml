[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-engine"
version = "0.1.0"
description = "Minimal C++ inference engine for Reef."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-timeout>=2.4.0", "ruff==0.16.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: multiple components",
    "experiment: end-to-end inference experiments",
    "slow: tests requiring a simulator or long runtime",
]
timeout = 300

[tool.ruff]
line-length = 80
target-version = "py312"
