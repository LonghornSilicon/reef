# CoralNPU at 8a5e1b31 (VmeCoreMini): the whole pinned RTL, as an overlay on
# the M3 model. That RTL is M3 plus 409 commits: the Zvt matrix engine and a
# changed fetch unit, LSU, retirement buffer, vector backend and FP units.
# It is the only RTL with a matrix engine, so the model's matrix numbers are
# checked here.
#
# This file does not change M3 (m3.yaml) or M3 + Zvt (m3_vme.yaml), and it
# is not Reef's design. It is a third machine, for correlation:
#
#   reef_perf --elf x.elf -c configs/machines/m3.yaml \
#       -c configs/machines/coral_pinned.yaml
#
# Every difference from M3 is one switch below: a value, or a parameter that
# turns new model code on. Each line says where its number came from and
# what the M3 value is. Removing a line turns that change off; with every
# line removed the model is m3.yaml exactly.
#
# Checked by tests/golden/pinned_results.json (cycle counts on this config)
# and scored against the RTL by
#   python -m reef_perf.experiments.correlation.pinned
# RTL numbers: rtl_pinned.csv next to each rtl_m3.csv.
#
# Each switch has an ID (F frontend, C core, V vector, X matrix). Sources:
# RTL = read in ~/coralnpu-pinned at 8a5e1b31; MEASURED = fitted to the
# programs named, in rtl_pinned.csv; TRACE = read from a waveform of this
# RTL. docs/pinned.md lists the differences not modeled yet.
top:
  frontend:
    params:
      # F1. The fetch unit after M3 (UncachedFetch.scala: FetchControl,
      # Fetcher, FetchReorderBuffer): a fetch every cycle down the next
      # 16-byte line, two in flight (maxConcurrentTx = 2), each line written
      # to the instruction buffer 2 cycles after its fetch (the bus response
      # is registered, then the reorder buffer's state), in order and whole.
      # A predicted jump's target is fetched in the cycle its line is
      # written; a mispredicted one 2 cycles after the core dispatches it
      # (the BRU resolves it the next cycle, fetch follows). The three
      # values are the defaults of fetch_max_in_flight,
      # fetch_response_cycles and redirect_from_dispatch_cycles.
      # M3: false (one fetch every other cycle; fetch_interval,
      # redirect_penalty)
      fetch_reorder_buffer: true
      # X1. Zvt instructions decode and run on the matrix module (the
      # engine's own values are the matrix module's defaults,
      # configs/matrix/coral_vme.yaml). RTL: --enableVme=True. M3: false
      zvt: true
  core:
    rob:
      params:
        # C1. RTL: Parameters.scala:141 retirementBufferSize = 16. M3: 8
        rob_entries: 16
    dispatch:
      params:
        # C4 (off). branch_ends_group: a conditional branch is the last
        # instruction dispatched in its cycle (Decode.scala:419-422, and the
        # waveform of matrix/mac_rob). It is right, but with it the matrix
        # programs only match if a MAC retires a cycle earlier than the
        # matrix module's mtx_complete_latency 1 gives, and that value is
        # not to change until matrix/mac_queue is explained (docs/pinned.md,
        # "The branch rule"). Off until then.
        # C3. A later writer of a load's destination dispatches in the cycle
        # the load's value is written, not the cycle before. TRACE:
        # addr_forward (each lw to a1 is dispatched in the previous one's
        # rd cycle). M3: 1
        load_waw_advance: 0
    lsu:
      params:
        # C2. LsuV3 (Lsu.scala, LsuSuperSlot) in place of M3's LSU: the slot
        # takes a whole instruction and walks its 16-byte registers one bus
        # cycle each; an unmasked unit-stride or strided load starts when
        # the core dispatches it, without waiting for the vector backend.
        # TRACE: microbenchmarks/lsu/ (docs/pinned.md, "LsuV3"). The
        # lsu_v3_* values keep their defaults, which are this RTL's.
        # M3: false
        lsu_v3: true
        # X2. A tile load or store costs 2 cycles per instruction + 1 per
        # 16-byte beat. MEASURED on this RTL: tile_*_burst in
        # microbenchmarks/matrix/rtl_vme.csv (docs/lsu-tile-beats.md).
        # M3: lsu_tile_cost false (a tile beat costs a vector register)
        lsu_tile_cost: true
        lsu_tile_inst_overhead: 1
        lsu_tile_beat_overhead: 0
        lsu_tile_switch_cycles: 1
  vector:
    params:
      # V1. RTL: rvv_backend_define.svh ROB_DEPTH 16. M3: 8
      vec_rob_entries: 16
      # V2. The retirement buffer matches a vector result to its entry by
      # rob_tag, not by PC. RTL: RetirementBuffer.scala:452, :532 (CoralNPU
      # 302a42d3). MEASURED: vdiv_m8_indep, vdiv_m8_then_vadd_m8. M3: true
      vec_completion_matches_pc: false
      # V3. The vector FP add and multiply-add unit has 4 stages. RTL:
      # FALU_PIPEREGS 4 (rvv_backend_define.svh). MEASURED: vfadd_chain and
      # vfmacc_chain are 1 cycle per op slower than on M3. M3: 4
      vec_fp_latency: 5
      # V3b. MEASURED: vfdiv_indep is 1 cycle per uop slower than on M3;
      # vfdiv_chain is unchanged, so the latency stays 9. M3: 8
      vec_fdiv_cycles_per_uop: 9
      # V6. The LSU reports a vector store complete once, after its last
      # register. RTL: Lsu.scala:1970-1971. M3: false (after each register)
      vec_store_completes_on_last_register: true
  memory:
    params:
      # M1. An external read holds the e-bus 4 cycles and a write 5 before
      # the LSU's own return time. TRACE: ext_load_stream, ext_store_stream,
      # ext_load_chain. The testbench memory adds no delay (deviations M3).
      # M3: axi_latency 2, axi_write_latency 0 (as a read)
      axi_latency: 4
      axi_write_latency: 5
