# Reef M3-baseline configuration for the coarse perf model.
#
# Reef's starting point is the CoralNPU M3 release. Right now every value
# equals the model's built-in default: a SUPER-COARSE, generic in-order core
# that does NOT yet correlate with the M3 RTL.
# The beginner tickets (docs/roadmap.md) replace these values, and
# add missing behavior, one step at a time. When you change a value, add a
# comment saying where the new number came from (RTL file:line or a B01
# measurement).
#
# Use it:              reef_perf --elf x.elf -c configs/machines/m3.yaml
# Override one value:  -p top.frontend.params.fetch_interval 2
# List all parameters: reef_perf --elf x.elf --show-parameters --no-run
#
# This is the *simulation* config (what machine to simulate). Experiment
# configs, which describe sweeps of runs, live under
# python/reef_perf/experiments/<experiment>/.
#
# One section per module; each module's owner maintains its section.
top:
  frontend:
    params:
      fetch_width: 4          # 128-bit fetch = 4 instructions
      fetch_interval: 2       # UncachedFetch.scala:194-195: no new fetch while response data is valid (D7)
      redirect_penalty: 2     # Bru.scala:202-212: a redirect the predictor did not predict; measured on microbenchmarks/frontend/ (U1)
      predictor: btfn         # UncachedFetch.scala:87-100: jal + backward branches predicted taken, free when right; no BTB/RAS (D6)
      fetch_block_bytes: 16   # UncachedFetch.scala:56,107-131: one aligned 16-byte line per fetch (--fetchDataBits=128)
      ibuf_entries: 8         # UncachedFetch.scala:234 window = fetchInstrSlots * 2
  core:
    dispatch:
      params:
        dispatch_width: 4
    scalar_exec:
      params:
        alu_count: 4
        alu_latency: 1
        mul_count: 1
        mul_latency: 2          # B11: measure (arbiter + 2 queued stages)
        mul_occupancy: 1
        div_latency: 32         # B12: data-dependent on M3
        div_occupancy: 32
        div_data_dependent: true # Dvu.scala:90-136: leading-zero early termination
        div_base: 2              # One setup cycle and one result cycle
        fpu_latency: 3          # B11: fpnew PipeRegs=3; measure
        fpu_occupancy: 1
        fdiv_latency: 12        # B11: measure
        fdiv_occupancy: 12
    lsu:
      params:
        lsu_queue_entries: 4    # Lsu.scala:835 CircularBufferMulti(..., 4)
        lsu_vector_load_reg_overhead: 3   # B14: fit to vle8 microbenchmarks on the
        lsu_vector_store_reg_overhead: 2  # RTL at LMUL 1 and 8 (per register:
                                          # 1 line + 3 load / + 2 store cycles)
    rob:
      params:
        rob_entries: 8          # Parameters.scala:95 retirementBufferSize = 8
        retire_width: 4         # B10: confirm from RetirementBuffer.scala
  vector:
    params:
      # Queues and widths: rvv_backend_define.svh under DISPATCH3.
      vec_queue_entries: 8        # CQ_DEPTH
      vec_de1_width: 2            # NUM_DE_INST
      vec_legal_queue_entries: 8  # LCQ_DEPTH
      vec_de2_width: 2            # NUM_DE_INST
      vec_de2_uop_width: 6        # NUM_DE_UOP
      vec_uop_queue_entries: 16   # UQ_DEPTH
      vec_dispatch_width: 3       # NUM_DP_UOP
      vec_station_entries: 8      # ALU_RS_DEPTH; B15: one per unit type
      vec_rob_entries: 8          # ROB_DEPTH
      vec_retire_width: 4         # NUM_RT_UOP
      vec_lanes: 2            # B15: replace with per-type functional units
      vlen_bits: 128
      # Cycles a uop spends in its unit (RTL waveforms, M3 vector timing):
      vec_addsub_latency: 2   # p0 + p1 (rvv_backend_alu_unit_addsub.sv)
      vec_alu_latency: 1      # p0 only: logic, shifts, masks, moves
      vec_mul_latency: 2
      vec_perm_latency: 3     # reductions
      vec_fp_latency: 4       # ASSUMPTION; not measured
      vec_cycles_per_uop: 1   # B15
      vec_div_cycles_per_uop: 8   # B15
      vec_to_scalar_latency: 0    # RTL waveform of vec_pingpong: the x
                                  # register is usable in the retire cycle
      vset_latency: 1         # U4: measure (was timed as an ALU op)
  matrix:
    params:                   # PLACEHOLDERS: no matrix ISA or RTL yet
      mtx_queue_entries: 4
      mtx_lanes: 1
      mtx_latency: 8
      mtx_occupancy: 4
  memory:
    params:
      itcm_latency: 2
      itcm_line_bytes: 16
      itcm_cycles_per_line: 1
      dtcm_latency: 5         # B13: measure load-to-use
      dtcm_line_bytes: 16     # 128-bit data bus
      dtcm_cycles_per_line: 4 # B13: measure
      axi_latency: 20         # ASSUMPTION: black-box round trip; no M3 source
      axi_bytes_per_beat: 32  # Parameters.scala:133 axi0DataBits = fetchDataBits = 256
      axi_max_outstanding: 4  # ASSUMPTION; no M3 source
