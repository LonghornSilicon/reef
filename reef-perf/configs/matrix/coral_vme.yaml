# CoralNPU's Zvt engine at 8a5e1b31: the matrix module's built-in defaults,
# written out so a sweep can start from them. Sources: docs/matrix.md.
# Use on top of m3.yaml (the machine) and m3_vme.yaml (turns Zvt on):
#   reef_perf --elf x.elf -c configs/machines/m3.yaml \
#       -c configs/machines/m3_vme.yaml -c configs/matrix/coral_vme.yaml
top:
  matrix:
    params:
      mtx_queue_entries: 4          # PLACEHOLDER: Zvt RS holds 8 uops (ZVT_RS_DEPTH), = 2 vtmm or 8 one-uop ops; counting uops needs Dispatch (matrix.md C4)
      mtx_cmd_latency: 4            # TRACE: dispatch to first MAC step is 6 = 4 + 2 issue cycles (mac_chain waveform)
      mtx_uops_per_cycle: 3         # RVV dispatch, 3 uops/cycle
      mtx_complete_latency: 1       # TRACE (8a5e1b31, mac_rob, zero_rob, move_tv_rob): vmeRtVld 2 cycles after the last controller cycle, retired that cycle
      mtx_num_arrays: 1
      mtx_pe_rows: 8                # NUM_PE = TE*TE*COMPRATIO = 64
      mtx_pe_cols: 8                #   (rvv_backend_define.svh:212-222)
      mtx_macs_per_pe_int8: 4       # 4 int8 per 32-bit PE lane (K word)
      mtx_macs_per_pe_bf16: 2       # 2 bf16 per lane (KMAX = 2)
      mtx_macs_per_pe_fp32: 1       # 1 fp32 per lane (KMAX = 1)
      mtx_dataflow: output          # C accumulates in the tile
      mtx_row_operand: broadcast    # A and B broadcast to the 4 blocks
      mtx_col_operand: broadcast
      mtx_mapping: coral             # CoralNPU's partial-tile rule (zvt_pe_array.sv:216-217)
      mtx_reduction: in_place
      mtx_pe_pipeline_depth: 9      # RTL + TRACE: mulbulk 3 + handshake_ff 1 + adder 3 + block skew 2; first step to retire is 14 (waveform)
      mtx_accumulate_latency: 0     # TRACE: folded into mtx_pe_pipeline_depth (first step to retire 14, mac_chain waveform)
      mtx_acc_raw_cycles: 4         # hitRaw: MULBULKPIPENUM + 1 (zvt_pe_array.sv:195-207)
      mtx_pipeline_across_ops: true # TRACE: mac_indep 4.0 cycles per MAC (false would give 13)
      mtx_zero_cycles: 4            # PROCESS_DELAY (zvt_ctrl.sv:435-445, :613)
      mtx_move_cycles_per_uop: 1    # RTL + TRACE: isMv2Vme/isMv2Rvv one uop per cycle (zvt_ctrl.sv:605-610); move_tv8_burst, move_vt_burst
      mtx_move_latency: 0           # RTL + TRACE: tile write is a flop (zvt_mt_reg.sv); move_then_mac, move_vt_use
      mtx_tile_write_latency: 1     # RTL + TRACE: flop write (zvt_mt_reg.sv); last load pop to first store read 1 cycle (load_then_store waveform), load_then_mac
      mtx_tile_read_latency: 1      # RTL: the tile read is combinational (zvt_mt.sv:68); the 1 is the vme2lsu FIFO register. mac_then_store matches
      mtx_lsu_fifo_entries: 2       # lsu2vme / vme2lsu DEPTH 2 (zvt.sv:163-206)
      mtx_ctrl_waits_for_array_drain: true  # !peBusy (zvt_ctrl.sv:105-106, :130-134)
