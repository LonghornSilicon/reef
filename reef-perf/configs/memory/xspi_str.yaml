# The XSPI link in STR (data on one edge of the link clock): the fallback if
# DTR does not work in silicon. Half the rate of xspi_dtr.yaml; see that
# file for the source and the units.
#
# Use it on top of m3.yaml:
#   reef_perf --elf x.elf -c configs/machines/m3.yaml \
#       -c configs/memory/xspi_str.yaml --ext-mem-mb 160
top:
  memory:
    params:
      ext_mem_latency: 24         # As xspi_dtr.yaml; ASSUMPTION: N = 8
      # 16 lines x 1 edge x 25 MHz = 400 Mb/s = 50 MB/s = 1 B per core cycle.
      ext_mem_bytes_per_cycle: 1
