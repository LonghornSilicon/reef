[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reef-perf"
version = "0.1.0"
description = "Coarse, execute-at-fetch performance model of the Reef NPU."
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "clang-format==21.1.6",
    "clang-tidy==21.1.6",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reef_perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: multiple components",
    "experiment: end-to-end experiment runs",
    "slow: tests requiring a simulator build or long runtime",
]
timeout = 1800

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
# Inside Docker the repo's .git is not mounted, so Ruff cannot apply
# .gitignore; exclude third-party and build directories explicitly.
extend-exclude = ["ext", "build", "results"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # modern Python syntax
    "SIM", # simplify code
    "ANN", # type annotations
    "D",   # docstrings
    "RET", # return statement consistency
    "RUF", # Ruff-specific rules
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
