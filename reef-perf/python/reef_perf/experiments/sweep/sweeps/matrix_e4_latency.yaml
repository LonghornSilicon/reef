# Matrix-engine experiment, docs/matrix-experiments.md. Kernel ELFs from
# inference-engine/coral (PR #57): set E2E_ROOT to their build directory, with
# one subdirectory per build: t1 (E2E_TOKENS=1 E2E_START_POS=16), t2, t4,
# t8 (defaults), t8p8 (E2E_START_POS=8), t1p79 (E2E_TOKENS=1
# E2E_START_POS=79).
#
# E4: how much engine latency the kernels absorb (pipeline depth, a slower
# engine clock, no accumulate forwarding), realistic and exposed memory.

name: matrix_e4_latency
sim_config:
  - configs/machines/m3.yaml
  - configs/machines/m3_vme.yaml
  - configs/matrix/coral_vme.yaml
  - configs/memory/xspi_str.yaml
  - configs/memory/psram_kv.yaml
sim_args: [--ext-mem-mb, "160"]
microbenchmarks: [matrix/mac_chain]
programs:
  fc1_t1: ${E2E_ROOT}/t1/fc1.elf
  fc1_t8: ${E2E_ROOT}/t8/fc1.elf
  qkv_t8: ${E2E_ROOT}/t8/qkv.elf
variants:
  rtl: {}
  pipe12: {top.matrix.params.mtx_pe_pipeline_depth: 12}
  pipe16: {top.matrix.params.mtx_pe_pipeline_depth: 16}
  clockdiv2: {top.matrix.params.mtx_fabric_clock_divider: 2}
  noforward: {top.matrix.params.mtx_acc_raw_cycles: 0}
grid:
  overlay: [configs/memory/xspi_str.yaml, python/reef_perf/experiments/sweep/sweeps/overlays/exposed_memory.yaml]
