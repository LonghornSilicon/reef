# Matrix-engine experiment, docs/matrix-experiments.md. Kernel ELFs from
# inference-engine/coral (PR #57): set E2E_ROOT to their build directory, with
# one subdirectory per build: t1 (E2E_TOKENS=1 E2E_START_POS=16), t2, t4,
# t8 (defaults), t8p8 (E2E_START_POS=8), t1p79 (E2E_TOKENS=1
# E2E_START_POS=79).
#
# E7: int4 by proxy on decode token 17. Native int4 lanes: twice the MACs per
# PE. Software unpack: half the weight bytes, i.e. twice the flash bandwidth
# (the unpack instructions are not in this proxy). An estimate from int8 runs.

name: matrix_e7_int4
sim_config:
  - configs/machines/m3.yaml
  - configs/machines/m3_vme.yaml
  - configs/matrix/coral_vme.yaml
  - configs/memory/xspi_str.yaml
  - configs/memory/psram_kv.yaml
sim_args: [--ext-mem-mb, "160"]
programs:
  embed_t1: ${E2E_ROOT}/t1/embed.elf
  layernorm_t1: ${E2E_ROOT}/t1/layernorm.elf
  qkv_t1: ${E2E_ROOT}/t1/qkv.elf
  attention_t1: ${E2E_ROOT}/t1/attention.elf
  attn_out_t1: ${E2E_ROOT}/t1/attn_out.elf
  fc1_t1: ${E2E_ROOT}/t1/fc1.elf
  fc2_t1: ${E2E_ROOT}/t1/fc2.elf
  lm_head_t1: ${E2E_ROOT}/t1/lm_head.elf
variants:
  macs4: {}
  macs8: {top.matrix.params.mtx_macs_per_pe_int8: 8}
grid:
  overlay:
    - configs/memory/xspi_str.yaml
    - configs/memory/xspi_dtr.yaml
    - python/reef_perf/experiments/sweep/sweeps/overlays/flash_4bpc.yaml
