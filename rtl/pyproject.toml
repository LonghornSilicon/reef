[project]
name = "reef-rtl"
version = "0.1.0"
description = "RTL tooling for Reef: handoff export and validation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
# Inside Docker the repo's .git is not mounted, so Ruff cannot apply
# .gitignore; exclude third-party and build directories explicitly.
extend-exclude = ["ext", "build", "out"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # modern Python syntax
    "SIM", # simplify code
    "ANN", # type annotations
    "D",   # docstrings
    "RET", # return statement consistency
    "RUF", # Ruff-specific rules
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
