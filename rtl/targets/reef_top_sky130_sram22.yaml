name: reef_top_sky130_sram22
top: reef_top
description: >-
  Reef v1 test-chip top (Drop 0). CoralNPU M3 RvvCoreMiniAxi, unmodified, with the TCMs
  on 5 SRAM22 sram22_512x128m4w8 macros and the clock gate on sky130_fd_sc_hd__sdlclkp_4.
filelist: filelists/reef_top_sky130_sram22.f
defines: [USE_GENERIC, TB_SUPPORT, VLEN_128, ZVE32F_ON, SYNTHESIS]
include_dirs: [src/common, ext/coralnpu-sv]
constraints: constraints/reef_top_sky130_sram22.sdc
clocks:
  - {name: clk, port: clk_i, period_ns: 20.0}
macros: [sram22_512x128m4w8]
technology_hint: sky130
status: experimental
owner: ajychien
io_map:
  - {port: clk_i, dir: in}
  - {port: rst_ni, dir: in}
  - {port: spi_sck_i, dir: in}
  - {port: spi_csn_i, dir: in}
  - {port: spi_mosi_i, dir: in}
  - {port: spi_miso_o, dir: out}
  - {port: test_en_i, dir: in}
  - {port: halted_o, dir: out}
  - {port: fault_o, dir: out}
  - {port: wfi_o, dir: out}
