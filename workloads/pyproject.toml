[[tool.uv.index]] 
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cu126"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu126" 
explicit = true

[tool.uv.sources] 
torch = [ { index = "pytorch-cu126", marker = "sys_platform == 'linux'" } ]
torchvision = [ { index = "pytorch-cu126", marker = "sys_platform == 'linux'" } ]
torchaudio = [ { index = "pytorch-cu126", marker = "sys_platform == 'linux'" } ]
swebench = { git = "https://github.com/SWE-bench/SWE-bench.git", rev = "02e7a74ffd0b707aab73d203fe87bdc7c76afc8e" }
util = { git = "https://git@github.com/justinmgarrigus/util.git", rev = "main" }

[tool.pytest] 
markers = [
    "slow: marks tests as slow",
    
    "unit: fast isolated tests", 
    "integration: multiple components", 
    "regression: previously-fixed bugs", 
    "experiment: end-to-end research experiments", 
    "benchmark: performance tests"
]
timeout = "300"
norecursedirs = [
    "llama.cpp",
    "SWE-bench",
    "logs",
    "experiments/function-bench/repos" 
]
addopts = [
    "--ignore=tests/test_vllm.py", 
    "--ignore=tests/test_profile.py", 
]

[project]
name = "llm-serving"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "fastmcp>=3.4.2",
    "fastmcp-slim>=3.4.2",
    "json2html>=1.3.0",
    "litellm>=1.90.1",
    "matplotlib>=3.11.0",
    "openhands-agent-server>=1.29.3",
    "openhands-sdk>=1.29.3",
    "openhands-tools>=1.29.3",
    "openhands-workspace>=1.29.3",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "python-frontmatter>=1.3.0",
    "torch",
    "torchvision",
    "torchaudio",
    "transformers>=5.12.1",
    "unidiff>=0.7.5",
    "pytest-timeout>=2.4.0",
    "util",
    "ruff>=0.15.20",
    "hatchling>=1.32.0",
    "deprecated>=1.3.1",
    "swebench",
]

[build-system] 
requires = ["hatchling"] 
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
llm-serving = ["hatchling"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # modern Python syntax
    "SIM",    # simplify code
    "ANN",    # type annotations
    "D",      # docstrings
    "RET",    # return statement consistency
    "RUF",    # Ruff-specific rules
]
exclude = [  # List deprecated files/directories.
    "experiments/expert/*",
    "experiments/exploration/*", 
    "experiments/exploration/*", 
    "experiments/function-bench/*",
    "experiments/timeseries.py",
    "experiments/transfer/*",
    "src/llm_serving/bench/*",
    "tests/test_vllm.py"
]

[tool.ruff.lint.pydocstyle]
convention = "google" 

[tool.ruff.format]
quote-style = "double"